
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: equipment-rental-api:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=EquipmentRentalsDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file}
      JwtSettings__Issuer: ${JWT_ISSUER:?Set JWT_ISSUER in your .env file}
      JwtSettings__Audience: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in your .env file}
      AdminSeed__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in your .env file}
      AdminSeed__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env file}

volumes:
  sqldata:
